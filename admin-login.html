<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PTC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="auth-card">
      <div class="auth-logo">🔐</div>
      <h2>Admin Portal</h2>
      <p class="auth-sub">Restricted access. Authorized personnel only.</p>
      <div id="adminLoginMsg"></div>
      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>Administrator ID</label>
          <input type="text" id="adminId" placeholder="Enter your admin ID" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPassword" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-primary full-width">Login</button>
      </form>
      <div class="demo-hint">
        <strong>Demo:</strong> ID = <code>admin</code> &nbsp;|&nbsp; Password = <code>admin123</code>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
